name: Kamera iOS Walkthrough (Simulator Video)

# Records a REAL walkthrough of the iOS app running in the iOS
# Simulator: a UI test drives the actual UI while `simctl io
# recordVideo` captures the simulator screen. This is a simulator
# recording (simulated camera feed), not physical-iPhone footage.

on:
  push:
    branches: [main]
    paths:
      - 'camera26-ios/**'
      - '.github/workflows/camera-ios-walkthrough.yml'
  workflow_dispatch:

jobs:
  walkthrough:
    # Xcode 26 SDK needed for the iOS 26 Liquid Glass APIs.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (26.x)
        run: |
          ls /Applications | grep -i Xcode || true
          NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version

      - name: Install XcodeGen and ffmpeg (for the video trim)
        run: brew install xcodegen ffmpeg

      - name: Generate Xcode project
        working-directory: camera26-ios
        run: xcodegen generate

      - name: Pick and boot an iPhone simulator
        run: |
          xcrun simctl list runtimes | grep -i ios || true
          # The iOS 26.5 simulator on this image exposes only a null
          # placeholder capture device (AVFoundationErrorDomain -11800 /
          # FigCapture -12782 at startRunning — no real virtual camera
          # behind it). Prefer the newest pre-26 iOS runtime, whose
          # simulator still carries a self-contained simulated camera;
          # fall back to the newest iOS runtime overall.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          cands = []
          for rt, devs in data["devices"].items():
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              ver = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devs:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      cands.append((ver, d["udid"], d["name"]))
          pre26 = [c for c in cands if c[0] < (26, 0)]
          pool = pre26 if pre26 else cands
          pool.sort()
          if pool:
              print(pool[-1][1])
              sys.stderr.write(f"chosen simulator: {pool[-1][2]} runtime {pool[-1][0]}\n")
          ')
          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes --json | jq -r '
              [.runtimes[] | select(.isAvailable and (.name | startswith("iOS")) and (.version | startswith("26") | not))]
              | sort_by(.version) | last.identifier // empty')
            if [ -z "$RT" ]; then
              RT=$(xcrun simctl list runtimes --json | jq -r '
                [.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))]
                | sort_by(.version) | last.identifier // empty')
            fi
            DT=$(xcrun simctl list devicetypes --json | jq -r '
              [.devicetypes[] | select(.name | startswith("iPhone"))]
              | last.identifier // empty')
            echo "Creating simulator: runtime=$RT type=$DT"
            UDID=$(xcrun simctl create "Kamera Walkthrough" "$DT" "$RT")
          fi
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for testing
        working-directory: camera26-ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project KameraIOS.xcodeproj \
            -scheme KameraIOS \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath build/TestData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Record walkthrough video (simctl) while the UI test runs
        id: runtest
        working-directory: camera26-ios
        run: |
          date +%s > record_start.txt
          xcrun simctl io "${SIM_UDID}" recordVideo --codec=h264 --force walkthrough-raw.mp4 &
          REC_PID=$!
          set +e
          xcodebuild test-without-building \
            -project KameraIOS.xcodeproj \
            -scheme KameraIOS \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -derivedDataPath build/TestData \
            -resultBundlePath build/Walkthrough.xcresult \
            2>&1 | tee xcodebuild-test.log
          TEST_RC=${PIPESTATUS[0]}
          set -e
          kill -INT "$REC_PID" || true
          wait "$REC_PID" || true
          echo "xcodebuild test exit code: $TEST_RC"
          echo "test_rc=$TEST_RC" >> "$GITHUB_OUTPUT"
          ls -la walkthrough-raw.mp4

      - name: Trim video to the actual test window
        working-directory: camera26-ios
        run: |
          python3 - <<'PY'
          import datetime, re, subprocess, sys, os

          raw = "walkthrough-raw.mp4"
          final = "walkthrough.mp4"
          try:
              start_epoch = int(open("record_start.txt").read().strip())
              log = open("xcodebuild-test.log", errors="replace").read()
              def ts(pattern):
                  m = re.search(pattern, log)
                  if not m:
                      return None
                  dt = datetime.datetime.strptime(m.group(1), "%Y-%m-%d %H:%M:%S.%f")
                  return dt.timestamp()
              stamp = r"(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)"
              suite_start = ts(r"Test Suite 'All tests' started at " + stamp)
              suite_end = None
              for m in re.finditer(r"Test Suite 'All tests' (?:passed|failed) at " + stamp, log):
                  suite_end = datetime.datetime.strptime(m.group(1), "%Y-%m-%d %H:%M:%S.%f").timestamp()
              if suite_start is None:
                  raise ValueError("suite start not found in log")
              offset = max(0.0, suite_start - start_epoch - 1.0)
              duration = 45.0
              if suite_end is not None:
                  duration = min(60.0, max(10.0, suite_end - suite_start + 2.0))
              print(f"trim: offset={offset:.1f}s duration={duration:.1f}s")
              subprocess.run(["ffmpeg", "-y", "-ss", f"{offset:.2f}", "-i", raw,
                              "-t", f"{duration:.2f}",
                              "-c:v", "libx264", "-preset", "veryfast", "-crf", "20",
                              "-pix_fmt", "yuv420p", "-r", "30", final], check=True)
          except Exception as e:
              print(f"trim failed ({e}); shipping raw recording")
              if os.path.exists(raw):
                  subprocess.run(["cp", raw, final])
          PY
          ls -la walkthrough.mp4
          ffprobe -v error -show_entries format=duration -show_entries stream=width,height,avg_frame_rate,codec_name walkthrough.mp4 || true

      - name: Dump simulator app log (diagnostics)
        if: always()
        working-directory: camera26-ios
        run: |
          xcrun simctl spawn "${SIM_UDID}" log show --style compact --last 10m \
            --predicate 'process == "KameraIOS"' > sim-app-log.txt 2>&1 || true
          wc -l sim-app-log.txt || true

      - name: Upload walkthrough video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kamera-iOS-Walkthrough-Video
          path: camera26-ios/walkthrough.mp4

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kamera-iOS-Walkthrough-Logs
          path: |
            camera26-ios/xcodebuild-test.log
            camera26-ios/sim-app-log.txt
            camera26-ios/build/Walkthrough.xcresult
