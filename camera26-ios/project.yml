name: KameraIOS
options:
  bundleIdPrefix: net.adnan120hz
  createIntermediateGroups: true
deploymentTarget:
  iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  KameraIOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: KameraIOS
        excludes:
          - "Info.plist"
    info:
      path: KameraIOS/Info.plist
      properties:
        CFBundleDisplayName: "Kamera iOS"
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "7"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Kamera iOS memerlukan akses kamera agar Anda dapat mengambil foto dan merekam video secara langsung dari aplikasi."
        NSMicrophoneUsageDescription: "Kamera iOS memerlukan akses mikrofon agar suara dapat ikut terekam saat Anda merekam video."
        NSPhotoLibraryAddUsageDescription: "Kamera iOS memerlukan izin untuk menyimpan hasil foto dan video ke galeri Foto Anda."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: KameraIOS
        PRODUCT_BUNDLE_IDENTIFIER: net.adnan120hz.camera26ios
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  KameraIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: KameraIOSUITests
    dependencies:
      - target: KameraIOS
    settings:
      base:
        PRODUCT_NAME: KameraIOSUITests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KameraIOS:
    build:
      targets:
        KameraIOS: all
        KameraIOSUITests: [test]
    test:
      targets:
        - KameraIOSUITests
