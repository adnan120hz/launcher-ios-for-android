name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build launcher debug APK
        run: ./gradlew :launcher:assembleDebug --stacktrace

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: launcher/build/outputs/apk/debug/*.apk

      - name: Build camera26 debug APK
        run: ./gradlew :camera26:assembleDebug --stacktrace

      - name: Upload camera26 APK
        uses: actions/upload-artifact@v4
        with:
          name: camera26-debug-apk
          path: camera26/build/outputs/apk/debug/*.apk
